name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · unit tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:types:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Sanitization scan
        run: scripts/check-sanitization.sh

  integration:
    name: integration tests (Postgres 16, Redis 7)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.12-alpine
        env:
          POSTGRES_USER: mtlms
          POSTGRES_PASSWORD: mtlms
          POSTGRES_DB: mtlms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mtlms -d mtlms"
          --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      # make test-integration recreates mtlms_test, migrates and seeds it, then runs the suite.
      MTLMS_PG_PORT: "5432"
      MTLMS_REDIS_PORT: "6379"
      JWT_SECRET: ci-only-jwt-secret-not-for-production-use-000
      CREDENTIALS_ENCRYPTION_KEY: ci-only-credentials-key-not-for-production-00
      INTERNAL_API_KEY: ci-only-internal-key-not-for-production-use-0
      DEMO_PASSWORD: ci-only-Demo-password-1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make test-integration
