# Checks run on this repository: lint, typecheck, unit tests and build across every
# package (the six apps, the shared packages and the provider stubs), the generated
# database types against the schema, the API integration tests on Postgres 16 + Redis 7
# (migrated and seeded first), the sanitization scan, and Terraform formatting and
# validation. Image builds, tflint, checkov, gitleaks and the end-to-end run live in
# .github/workflows-full/: enable them in your fork.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck, unit tests, build, db types, sanitization
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated database types match the schema
        run: pnpm db:types:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests (no database)
        run: pnpm test
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Sanitization scan
        run: scripts/check-sanitization.sh

  integration:
    name: integration tests (Postgres 16, Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.12-alpine
        env:
          POSTGRES_USER: mtlms
          POSTGRES_PASSWORD: mtlms
          POSTGRES_DB: mtlms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mtlms -d mtlms"
          --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      # make test-integration recreates open_mtlms_test (the name must end in _test) on
      # the service Postgres, applies db/migrations, seeds the platform catalog (each spec
      # creates its own tenants), then runs the suite against the service Redis (DB 5).
      MTLMS_PG_PORT: "5432"
      MTLMS_REDIS_PORT: "6379"
      # Throwaway values for the APIs' config checks (NODE_ENV=test, never production).
      JWT_SECRET: ci-only-jwt-secret-not-for-production-use-000
      CREDENTIALS_ENCRYPTION_KEY: ci-only-credentials-key-not-for-production-00
      INTERNAL_API_KEY: ci-only-internal-key-not-for-production-use-0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make test-integration

  terraform:
    name: terraform fmt, validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -check -recursive infra/terraform
      - name: validate every environment
        run: |
          for env in local-floci aws-dev aws-prod; do
            echo "== $env"
            terraform -chdir=infra/terraform/envs/$env init -backend=false -input=false -no-color >/dev/null
            terraform -chdir=infra/terraform/envs/$env validate -no-color
          done
