# ─────────────────────────────────────────────────────────────────────────────
# Open multi-tenant LMS: local stack (cloud-agnostic base).
#
# Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# On its own the base runs without any AWS at all: files on local disk, email logged
# instead of sent (no AWS_SES_FROM_EMAIL).
#
# Three tiers, each a Next.js app (a Node server, so SSR works) and an Express API:
#
#   console   http://localhost:3600   operator console     -> console-api  :5076
#   admin     http://localhost:3610   tenant admin         -> admin-api    :5086
#   web       http://<tenant>.lvh.me:3620  learner storefront -> learner-api :5096
#
# lvh.me and every subdomain of it resolve to 127.0.0.1, so a tenant's storefront is
# http://northwind.lvh.me:3620 with no hosts-file edits (ROOT_DOMAIN=lvh.me).
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh): random, local-only throwaways. `make up-aws` also reads
# deploy/compose/.env.aws, whose values win over the defaults here.
#
# Host ports (override in .env, or in your shell, if they clash with something else):
#   console 3600  admin 3610  web 3620  console-api 5076  admin-api 5086
#   learner-api 5096  postgres 5542  redis 6479  stubs 5189
#   floci 4647  mailpit 8096 (SMTP 1096), with the Floci overlay
#
# No real provider account is needed anywhere: Stripe, Razorpay, the video system (EVS)
# and the OpenAI-compatible AI endpoint are the `stubs` service (apps/stubs), and AI
# authoring uses the deterministic offline engine unless AI_PROVIDER=openai is set.
# ─────────────────────────────────────────────────────────────────────────────
name: open-mtlms

# Visibly fake, local-only gateway credentials. The stubs sign with these webhook
# secrets; the platform keys tell them which webhooks belong to admin-api; the demo seed
# stores the tenant ones on the demo tenants' gateway connections.
x-stub-credentials: &stub-credentials
  STUB_STRIPE_WEBHOOK_SECRET: whsec_stub_local_only
  STUB_RAZORPAY_WEBHOOK_SECRET: rzp_whsec_stub_local_only
  STUB_PLATFORM_STRIPE_SECRET_KEY: sk_test_stub_platform
  STUB_PLATFORM_RAZORPAY_KEY_ID: rzp_test_stubplatform
  STUB_PLATFORM_RAZORPAY_KEY_SECRET: rzp_secret_stub_platform
  STUB_TENANT_STRIPE_SECRET_KEY: sk_test_stub_tenant
  STUB_TENANT_STRIPE_PUBLISHABLE_KEY: pk_test_stub_tenant
  STUB_TENANT_RAZORPAY_KEY_ID: rzp_test_stubtenant
  STUB_TENANT_RAZORPAY_KEY_SECRET: rzp_secret_stub_tenant

# Every value an overlay or an env file may want to change is a ${NAME:-default}
# interpolation. Precedence, highest first: an overlay's `environment:`, your shell, the
# last --env-file (.env.aws for up-aws, then .env), the default below.
x-api-env: &api-env
  # Development mode: the production config guards only warn, and the stack links to
  # localhost, which production would refuse.
  NODE_ENV: development
  TZ: UTC
  LOG_LEVEL: ${LOG_LEVEL:-info}
  BRAND_NAME: ${MTLMS_BRAND_NAME:-Open LMS Cloud}
  ROOT_DOMAIN: ${MTLMS_ROOT_DOMAIN:-lvh.me}
  # Where browsers land (links in emails, checkout returns, invites).
  CONSOLE_URL: http://localhost:${MTLMS_CONSOLE_PORT:-3600}
  ADMIN_URL: http://localhost:${MTLMS_ADMIN_PORT:-3610}
  WEB_URL: http://${MTLMS_ROOT_DOMAIN:-lvh.me}:${MTLMS_WEB_PORT:-3620}
  WEB_PORT: ${MTLMS_WEB_PORT:-3620}
  # Public bases of the APIs (links the APIs build to themselves).
  CONSOLE_API_PUBLIC_URL: http://localhost:${MTLMS_CONSOLE_API_PORT:-5076}
  ADMIN_API_PUBLIC_URL: http://localhost:${MTLMS_ADMIN_API_PORT:-5086}
  LEARNER_API_PUBLIC_URL: http://localhost:${MTLMS_LEARNER_API_PORT:-5096}
  # Service to service (INTERNAL_API_KEY authenticates these calls).
  CONSOLE_API_INTERNAL_URL: http://console-api:5076
  ADMIN_API_INTERNAL_URL: http://admin-api:5086
  LEARNER_API_INTERNAL_URL: http://learner-api:5096
  CORS_ORIGINS: http://localhost:${MTLMS_CONSOLE_PORT:-3600},http://localhost:${MTLMS_ADMIN_PORT:-3610}
  # The browser talks to each API directly: no proxy hop to trust.
  TRUST_PROXY: "0"
  # Sign-in limits sized for a laptop running the demo and end-to-end tests over
  # and over; production keeps the defaults (10 per email, 30 per IP, x1).
  AUTH_RATE_LIMIT_PER_EMAIL: ${MTLMS_AUTH_RATE_LIMIT_PER_EMAIL:-100}
  AUTH_RATE_LIMIT_PER_IP: ${MTLMS_AUTH_RATE_LIMIT_PER_IP:-300}
  AUTH_RATE_LIMIT_SCALE: ${MTLMS_AUTH_RATE_LIMIT_SCALE:-10}
  PG_DATABASE_HOST: postgres
  PG_DATABASE_PORT: "5432"
  PG_DATABASE_USER: mtlms
  PG_DATABASE_PASSWORD: mtlms
  PG_DATABASE: mtlms
  DATABASE_URL: postgresql://mtlms:mtlms@postgres:5432/mtlms
  PG_POOL_MAX: ${PG_POOL_MAX:-10}
  REDIS_URL: redis://redis:6379
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  JWT_SECRET: ${MTLMS_JWT_SECRET:?run `make env` first}
  # Learner sessions have their own key (learner-api only reads it).
  LEARNER_JWT_SECRET: ${MTLMS_LEARNER_JWT_SECRET:?run `make env` first}
  # Seals every gateway credential a tenant stores (enc:v1:, AES-256-GCM). Changing it
  # makes the stored ones unreadable (re-enter them).
  CREDENTIALS_ENCRYPTION_KEY: ${MTLMS_CREDENTIALS_ENCRYPTION_KEY:?run `make env` first}
  INTERNAL_API_KEY: ${MTLMS_INTERNAL_API_KEY:?run `make env` first}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  # Files on local disk unless an overlay (or you) sets a bucket.
  AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
  LOCAL_STORAGE_DIR: /tmp/local-storage
  # Payment gateways and the video system: the stubs, unless you point them elsewhere.
  STRIPE_API_BASE: ${STRIPE_API_BASE:-http://stubs:5189}
  RAZORPAY_API_BASE: ${RAZORPAY_API_BASE:-http://stubs:5189}
  EVS_API_URL: ${EVS_API_URL:-http://stubs:5189}
  EVS_API_KEY: ${EVS_API_KEY:-local-evs-key}

# The three APIs share one Dockerfile (build arg APP). migrate and tools reuse console-api.
x-api-build: &api-build
  context: ../..
  dockerfile: infra/docker/api.Dockerfile
  target: runtime

x-next-build: &next-build
  context: ../..
  dockerfile: infra/docker/next.Dockerfile

x-api-common: &api-common
  env_file: [.env]
  tmpfs:
    - /tmp:uid=1000,gid=1000
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.12-alpine
    environment:
      POSTGRES_DB: mtlms
      POSTGRES_USER: mtlms
      POSTGRES_PASSWORD: mtlms
    ports:
      - "127.0.0.1:${MTLMS_PG_PORT:-5542}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtlms -d mtlms"]
      interval: 3s
      timeout: 3s
      retries: 30

  # BullMQ queues, rate limits and caches. ElastiCache (infra/terraform/modules/cache) on AWS.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${MTLMS_REDIS_PORT:-6479}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Stripe, Razorpay, EVS and an OpenAI-compatible API, simulated (apps/stubs).
  stubs:
    build:
      context: ../..
      dockerfile: infra/docker/stubs.Dockerfile
    image: open-mtlms-stubs:local
    environment:
      PORT: "5189"
      STUBS_PUBLIC_URL: http://localhost:${MTLMS_STUBS_PORT:-5189}
      STUBS_LEARNER_API_URL: http://learner-api:5096
      STUBS_ADMIN_API_URL: http://admin-api:5086
      STUBS_STRIPE_WEBHOOK_SECRET: whsec_stub_local_only
      STUBS_RAZORPAY_WEBHOOK_SECRET: rzp_whsec_stub_local_only
      STUBS_PLATFORM_STRIPE_SECRET_KEY: sk_test_stub_platform
      STUBS_PLATFORM_RAZORPAY_KEY_ID: rzp_test_stubplatform
      STUBS_EVS_API_KEY: ${EVS_API_KEY:-local-evs-key}
    ports:
      - "127.0.0.1:${MTLMS_STUBS_PORT:-5189}:5189"
    restart: unless-stopped

  # One-shot: apply db/migrations, then exit 0. The APIs wait for it.
  migrate:
    build:
      <<: *api-build
      args: { APP: console-api, PORT: "5076" }
    image: open-mtlms-console-api:local
    command: ["node", "db/migrate.js"]
    environment:
      <<: *api-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Tier 1: the operator plane (plans, tenants, entitlements, platform billing).
  console-api:
    <<: *api-common
    build:
      <<: *api-build
      args: { APP: console-api, PORT: "5076" }
    image: open-mtlms-console-api:local
    environment:
      <<: [*api-env, *stub-credentials]
      PORT: "5076"
      DEMO_PASSWORD: ${MTLMS_DEMO_PASSWORD:-}
    ports:
      - "127.0.0.1:${MTLMS_CONSOLE_API_PORT:-5076}:5076"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Tier 2: tenant administration (catalog, learners, pages, gateways, AI authoring).
  admin-api:
    <<: *api-common
    build:
      <<: *api-build
      args: { APP: admin-api, PORT: "5086" }
    image: open-mtlms-admin-api:local
    environment:
      <<: *api-env
      PORT: "5086"
      # Platform billing (the operator charging tenants) through the stubs.
      PLATFORM_STRIPE_SECRET_KEY: sk_test_stub_platform
      PLATFORM_STRIPE_PUBLISHABLE_KEY: pk_test_stub_platform
      PLATFORM_STRIPE_WEBHOOK_SECRET: whsec_stub_local_only
      PLATFORM_RAZORPAY_KEY_ID: rzp_test_stubplatform
      PLATFORM_RAZORPAY_KEY_SECRET: rzp_secret_stub_platform
      PLATFORM_RAZORPAY_WEBHOOK_SECRET: rzp_whsec_stub_local_only
      # AI authoring: offline (deterministic) unless you choose openai. AI_PROVIDER=openai
      # with AI_BASE_URL=http://stubs:5189/v1 exercises the real client against the stub.
      AI_PROVIDER: ${AI_PROVIDER:-offline}
      AI_BASE_URL: ${AI_BASE_URL:-http://stubs:5189/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL:-}
    ports:
      - "127.0.0.1:${MTLMS_ADMIN_API_PORT:-5086}:5086"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Tier 3: the learner storefront API (tenant from the Host or X-Tenant-Host header).
  learner-api:
    <<: *api-common
    build:
      <<: *api-build
      args: { APP: learner-api, PORT: "5096" }
    image: open-mtlms-learner-api:local
    environment:
      <<: *api-env
      PORT: "5096"
      CORS_ORIGINS: http://localhost:${MTLMS_WEB_PORT:-3620},http://*.${MTLMS_ROOT_DOMAIN:-lvh.me}:${MTLMS_WEB_PORT:-3620}
    ports:
      - "127.0.0.1:${MTLMS_LEARNER_API_PORT:-5096}:5096"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  console:
    build:
      <<: *next-build
      args:
        APP: console
        PORT: "3600"
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${MTLMS_CONSOLE_API_PORT:-5076}/api/v1
        NEXT_PUBLIC_ROOT_DOMAIN: ${MTLMS_ROOT_DOMAIN:-lvh.me}
        NEXT_PUBLIC_ADMIN_URL: http://localhost:${MTLMS_ADMIN_PORT:-3610}
        NEXT_PUBLIC_WEB_BASE_URL: http://${MTLMS_ROOT_DOMAIN:-lvh.me}:${MTLMS_WEB_PORT:-3620}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
    image: open-mtlms-console:local
    environment:
      PORT: "3600"
    ports:
      - "127.0.0.1:${MTLMS_CONSOLE_PORT:-3600}:3600"
    depends_on:
      console-api:
        condition: service_started
    restart: unless-stopped

  admin:
    build:
      <<: *next-build
      args:
        APP: admin
        PORT: "3610"
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${MTLMS_ADMIN_API_PORT:-5086}/api/v1
        # The /api/proxy rewrite runs in the admin container: reach admin-api by name.
        API_PROXY_TARGET: http://admin-api:5086/api/v1
        NEXT_PUBLIC_LEARNER_API_BASE_URL: http://localhost:${MTLMS_LEARNER_API_PORT:-5096}/api/v1
        NEXT_PUBLIC_ROOT_DOMAIN: ${MTLMS_ROOT_DOMAIN:-lvh.me}
        NEXT_PUBLIC_WEB_BASE_URL: http://${MTLMS_ROOT_DOMAIN:-lvh.me}:${MTLMS_WEB_PORT:-3620}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
    image: open-mtlms-admin:local
    environment:
      PORT: "3610"
    ports:
      - "127.0.0.1:${MTLMS_ADMIN_PORT:-3610}:3610"
    depends_on:
      admin-api:
        condition: service_started
    restart: unless-stopped

  # The storefront. Browsers call learner-api at localhost:5096 (sending X-Tenant-Host);
  # server-side rendering calls it inside the network (API_INTERNAL_BASE_URL).
  web:
    build:
      <<: *next-build
      args:
        APP: web
        PORT: "3620"
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${MTLMS_LEARNER_API_PORT:-5096}/api/v1
        NEXT_PUBLIC_ROOT_DOMAIN: ${MTLMS_ROOT_DOMAIN:-lvh.me}
        NEXT_PUBLIC_RAZORPAY_CHECKOUT_URL: http://localhost:${MTLMS_STUBS_PORT:-5189}/razorpay/checkout.js
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
    image: open-mtlms-web:local
    environment:
      PORT: "3620"
      API_INTERNAL_BASE_URL: http://learner-api:5096/api/v1
      ROOT_DOMAIN: ${MTLMS_ROOT_DOMAIN:-lvh.me}
    ports:
      - "127.0.0.1:${MTLMS_WEB_PORT:-3620}:3620"
    depends_on:
      learner-api:
        condition: service_started
    restart: unless-stopped

  # Not started by `make up`: the full workspace (pnpm, tsx, sources) for seeds and
  # scripts. `make demo` runs `pnpm --filter @open-mtlms/console-api demo:seed` in it.
  tools:
    profiles: ["tools"]
    build:
      <<: *api-build
      target: tools
      args: { APP: console-api }
    image: open-mtlms-tools:local
    env_file: [.env]
    environment:
      <<: [*api-env, *stub-credentials]
      DEMO_PASSWORD: ${MTLMS_DEMO_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  pgdata:
  redisdata:
