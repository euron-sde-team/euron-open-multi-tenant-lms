# ─────────────────────────────────────────────────────────────────────────────
# Overlay: emulated AWS with Floci (https://github.com/floci-io/floci, MIT).
#
# The SAME Terraform modules that provision real AWS (infra/terraform/modules) run here
# against the emulator: the `terraform` one-shot applies infra/terraform/envs/local-floci
# (KMS key, Secrets Manager secret, the assets bucket, a Route53 zone, the SES identity
# with DKIM, and the SES events SNS topic + SQS queue) before the APIs start. Every AWS
# client in the APIs then talks to the emulator (AWS_ENDPOINT_URL):
#
#   mail     SES v2 from no-reply@lms.example.test (verified through DKIM); the emulator
#            relays every message to Mailpit (http://localhost:8096)
#   events   SES configuration sets publish to the SNS topic; the APIs long-poll the
#            SQS queue behind it
#   files    the emulated assets bucket (open-mtlms-local-assets). Inside the network
#            the APIs reach it at http://floci:4566; browsers get links and presigned
#            uploads on http://localhost:4647 (AWS_S3_PUBLIC_ENDPOINT).
#
# Redis stays a plain container: Floci emulates the ElastiCache control plane but only
# backs it with a real server through the Docker socket, which is not worth mounting.
# ─────────────────────────────────────────────────────────────────────────────
x-floci-env: &floci-env
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://floci:4566
  AWS_S3_FORCE_PATH_STYLE: "true"
  # Names come from infra/terraform/envs/local-floci (name_prefix open-mtlms-local).
  AWS_S3_BUCKET: open-mtlms-local-assets
  AWS_S3_PUBLIC_ENDPOINT: http://localhost:${MTLMS_FLOCI_PORT:-4647}
  AWS_S3_PUBLIC_BASE_URL: http://localhost:${MTLMS_FLOCI_PORT:-4647}/open-mtlms-local-assets
  # The SES and SQS clients use these static keys; the emulator accepts any.
  AWS_SES_REGION: us-east-1
  AWS_SES_ACCESS_KEY: test
  AWS_SES_SECRET_KEY: test
  AWS_SES_FROM_EMAIL: no-reply@lms.example.test
  AWS_SES_FROM_NAME: ${MTLMS_BRAND_NAME:-Open LMS Cloud}
  SES_EVENTS_SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:open-mtlms-local-ses-events
  SES_EVENTS_QUEUE_URL: http://floci:4566/000000000000/open-mtlms-local-ses-events

x-after-terraform: &after-terraform
  terraform:
    condition: service_completed_successfully

services:
  floci:
    image: floci/floci:2.3.0
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /data
      # Relay every SES send to Mailpit so mail can be read in a browser.
      FLOCI_SERVICES_SES_SMTP_HOST: mailpit
      FLOCI_SERVICES_SES_SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:${MTLMS_FLOCI_PORT:-4647}:4566"
    networks:
      default:
        # S3 Control (bucket tags) addresses <account id>.<endpoint host>.
        aliases: ["000000000000.floci"]
    volumes:
      - flocidata:/data
    # No healthcheck: the image ships no HTTP client; the terraform one-shot polls it.

  # Every mail the emulator's SES sends. Web UI: http://localhost:8096
  mailpit:
    image: axllent/mailpit:v1.27.9
    ports:
      - "127.0.0.1:${MTLMS_MAILPIT_PORT:-8096}:8025"
      - "127.0.0.1:${MTLMS_MAILPIT_SMTP_PORT:-1096}:1025"

  # One-shot: provision the emulator with the production modules.
  terraform:
    image: hashicorp/terraform:1.16.6
    working_dir: /infra/envs/local-floci
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "waiting for floci..."
        until wget -q -O /dev/null http://floci:4566/; do sleep 1; done
        mkdir -p /tfdata/state
        terraform init -input=false -no-color >/dev/null
        # State lives in the tfdata volume, so it shares the emulator's lifecycle
        # (make down wipes both together).
        terraform apply -input=false -auto-approve -no-color -state=/tfdata/state/local.tfstate \
          -var endpoint=http://floci:4566 \
          -var 'app_origins=["http://localhost:${MTLMS_CONSOLE_PORT:-3600}","http://localhost:${MTLMS_ADMIN_PORT:-3610}","http://*.${MTLMS_ROOT_DOMAIN:-lvh.me}:${MTLMS_WEB_PORT:-3620}"]'
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "1"
      TF_DATA_DIR: /tfdata
    volumes:
      - ../../infra/terraform:/infra
      - tfdata:/tfdata
    depends_on:
      - floci
      - mailpit
    restart: "no"

  migrate:
    depends_on: *after-terraform

  console-api:
    environment:
      <<: *floci-env
    depends_on: *after-terraform

  admin-api:
    environment:
      <<: *floci-env
    depends_on: *after-terraform

  learner-api:
    environment:
      <<: *floci-env
    depends_on: *after-terraform

  tools:
    environment:
      <<: *floci-env

volumes:
  flocidata:
  tfdata:
